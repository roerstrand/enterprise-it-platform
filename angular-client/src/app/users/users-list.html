<div class="page page-narrow">
  <h1 class="page-title"><mat-icon aria-hidden="true">group</mat-icon>Users</h1>

  <mat-card class="table-card">
    @if (loading()) {
      <div class="loading-container">
        <mat-spinner diameter="40" />
      </div>
    } @else if (users().length === 0) {
      <p class="empty-state">No users yet.</p>
    } @else {
      <div class="table-scroll">
        <table mat-table [dataSource]="users()">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef class="col-id">ID</th>
            <td mat-cell *matCellDef="let user" class="mono col-id">{{ user.id }}</td>
          </ng-container>
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let user">{{ user.name }}</td>
          </ng-container>
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let user">{{ user.email }}</td>
          </ng-container>
          <ng-container matColumnDef="role_readonly">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let user">{{ user.role }}</td>
          </ng-container>
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let user">
              <!-- Bara Admin ser denna kolumn (displayedColumns väljer role vs role_readonly) -->
              <mat-select [value]="user.role" (selectionChange)="onRoleChange(user, $event.value)" class="role-select">
                @for (role of roles; track role) {
                  <mat-option [value]="role">{{ role }}</mat-option>
                }
              </mat-select>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    }
  </mat-card>
</div>
