<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-icon aria-hidden="true">hub</mat-icon>
      <mat-card-title>Enterprise IT</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (error()) {
          <p class="error-text">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="submit-button" [disableRipple]="true" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            Log in
          }
        </button>

        <p class="signup-hint">No account? <a routerLink="/register" class="signup-link">Create one</a></p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
