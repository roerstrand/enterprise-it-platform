<form [formGroup]="form" (ngSubmit)="onSubmit()" class="ci-form">
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" placeholder="db-o2" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>CI type</mat-label>
    <input matInput formControlName="ciType" placeholder="server" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Environment</mat-label>
    <input matInput formControlName="environment" placeholder="production" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Owner user id (optional)</mat-label>
    <input matInput type="number" formControllName="ownerUserId" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
    Create CI
  </button>
</form>

@if (loading()) {
  <mat-spinner diameter="40" />
} @else {
  <table mat-table [dataSource]="cis()" class="mat-elevation-z2">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let ci">{{ ci.id }}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let ci">{{ ci.name }}</td>
    </ng-container>
    <ng-container matColumnDef="ci_type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let ci">{{ ci.ci_type }}</td>
    </ng-container>
    <ng-container matColumnDef="environment">
      <th mat-header-cell *matHeaderCellDef>Environment</th>
      <td mat-cell *matCellDef="let ci">{{ ci.environment }}</td>
    </ng-container>
    <ng-container matColumnDef="owner_user_id">
      <th mat-header-cell *matHeaderCellDef>Owner user id</th>
      <td mat-cell *matCellDef="let ci">{{ ci.owner_user_id ?? '-' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
