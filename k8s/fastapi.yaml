apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: fastapi-app:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: SECRET_KEY
            - name: USER_SERVICE_ADDR
              value: "user-server:50051"
            - name: INCIDENT_SERVICE_ADDR
              value: "incident-server:50053"
            - name: CMDB_SERVICE_ADDR
              value: "cmdb-server:50052"
            - name: CHANGE_SERVICE_ADDR
              value: "change-service:50054"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger:4317"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
spec:
  selector:
    app: fastapi
  ports:
    - port: 8000
      targetPort: 8000
