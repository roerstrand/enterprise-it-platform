apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-server
  template:
    metadata:
      labels:
        app: incident-server
    spec:
      containers:
        - name: incident-server
          image: incident-server:local
          imagePullPolicy: Never
          ports:
            - containerPort: 50053
            - containerPort: 9103
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: CMDB_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: CMDB_SERVICE_ADDR
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          livenessProbe:
            grpc:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            grpc:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: incident-server
spec:
  selector:
    app: incident-server
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
    - name: metrics
      port: 9103
      targetPort: 9103
