apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cmdb-server
  template:
    metadata:
      labels:
        app: cmdb-server
    spec:
      containers:
        - name: cmdb-server
          image: cmdb-server:local
          imagePullPolicy: Never
          ports:
            - containerPort: 50052
            - containerPort: 9102
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: USER_SERVICE_ADDR
              value: "user-server:50051"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger:4317"
---
apiVersion: v1
kind: Service
metadata:
  name: cmdb-server
spec:
  selector:
    app: cmdb-server
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: metrics
      port: 9102
      targetPort: 9102
