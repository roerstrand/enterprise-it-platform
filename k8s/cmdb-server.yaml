apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmdb-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cmdb-server
  template:
    metadata:
      labels:
        app: cmdb-server
    spec:
      containers:
        - name: cmdb-server
          image: cmdb-server:local
          imagePullPolicy: Never
          ports:
            - containerPort: 50052
            - containerPort: 9102
          env:
             
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_URL
            - name: USER_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USER_SERVICE_ADDR
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cmdb-server
spec:
  selector:
    app: cmdb-server
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: metrics
      port: 9102
      targetPort: 9102
