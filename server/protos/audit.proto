syntax = "proto3";
option csharp_namespace = "AuditService.Grpc";

package audit;

service AuditService {
    rpc RecordAuditEvent (RecordAuditEventRequest) returns (Empty);
    rpc ListAuditEvents (ListAuditEventsRequest) returns (AuditEventList);
}

message Empty {}

message RecordAuditEventRequest {
    int32 actor_user_id = 1;
    string actor_email = 2;
    string action = 3;
    string entity_type = 4;
    string entity_id = 5;
    string before_json = 6;
    string after_json = 7;
}

message AuditEvent {
    int32 id = 1;
    string timestamp = 2;
    int32 actor_user_id = 3;
    string actor_email = 4;
    string action = 5;
    string entity_type = 6;
    string entity_id = 7;
    string before_json = 8;
    string after_json = 9;
}

message ListAuditEventsRequest {
    // Alla filter är optional - tom sträng = ingen filtrering på det fältet
    string entity_type = 1;
    string entity_id = 2;
    string action = 3;
    int32 limit = 4;
}

message AuditEventList {
    repeated AuditEvent events = 1;
}
