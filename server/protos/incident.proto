syntax = "proto3";

package incident;

service IncidentService {
    rpc CreateIncident (CreateIncidentRequest) returns (IncidentResponse);
    rpc GetIncident (IncidentIdRequest) returns (IncidentResponse);
    rpc ListIncidents (Empty) returns (IncidentList);
    rpc GetIncidentWithCI (IncidentIdRequest) returns (IncidentWithCIResponse);
    rpc AddIncidentUpdate (AddIncidentUpdateRequest) returns (IncidentResponse);
    rpc GetIncidentUpdates (IncidentIdRequest) returns (IncidentUpdateList);
    rpc AcceptSuggestedSeverity (IncidentActionRequest) returns (IncidentResponse);
    rpc AcceptSuggestedStatus (IncidentActionRequest) returns (IncidentResponse);
    rpc UpdateIncident (UpdateIncidentRequest) returns (IncidentResponse);
    rpc UpdateIncidentStatus (UpdateIncidentStatusRequest) returns (IncidentResponse);
    rpc UpdateIncidentSeverity (UpdateIncidentSeverityRequest) returns (IncidentResponse);
    rpc DeleteIncident (IncidentActionRequest) returns (Empty);
}

message Empty {}

message IncidentIdRequest {
    int32 id = 1;
}

// id + vem som utför handlingen - används av alla mutationer som bara tar ett id
// (accept-severity/status, delete) så att incident_server kan skriva korrekt audit-logg.
message IncidentActionRequest {
    int32 id = 1;
    int32 actor_user_id = 2;
    string actor_email = 3;
}

message AddIncidentUpdateRequest {
    int32 incident_id = 1;
    string text = 2;
    int32 actor_user_id = 3;
    string actor_email = 4;
}

message IncidentUpdateResponse {
    int32 id = 1;
    int32 incident_id = 2;
    string text = 3;
    int32 author_user_id = 4;
    string author_email = 5;
    string created_at = 6;
}

message IncidentUpdateList {
    repeated IncidentUpdateResponse updates = 1;
}

message CreateIncidentRequest {
    string title = 1;
    string description = 2;
    string severity = 3;
    int32 ci_id = 4;
    int32 actor_user_id = 5;
    string actor_email = 6;
}

message UpdateIncidentRequest {
    int32 id = 1;
    string title = 2;
    string description = 3;
    string severity = 4;
    int32 ci_id = 5;
    int32 actor_user_id = 6;
    string actor_email = 7;
}

message UpdateIncidentStatusRequest {
    int32 id = 1;
    string status = 2;
    int32 actor_user_id = 3;
    string actor_email = 4;
}

message UpdateIncidentSeverityRequest {
    int32 id = 1;
    string severity = 2;
    int32 actor_user_id = 3;
    string actor_email = 4;
}

message IncidentResponse {
    int32 id = 1;
    string title = 2;
    string description = 3;
    string status = 4;
    string severity = 5;
    int32 ci_id = 6;
    string ai_summary = 7;
    string ai_summary_status = 8;
    string ai_suggested_severity = 9;
    string ai_suggested_status = 10;
    string created_at = 11;
    string updated_at = 12;
}

message IncidentList {
    repeated IncidentResponse incidents = 1;
}

message IncidentWithCIResponse {
    IncidentResponse incident = 1;
    string ci_name = 2;
    string ci_environment = 3;
    string ci_type = 4;
    string owner_name = 5;
    string owner_email = 6;
}
