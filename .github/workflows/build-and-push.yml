name: Build and push images

# Körs vid varje push till main
on:
  push:
    branches: [main]

# id-token: write krävs f OIDC inloggning nedan
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # include: en rad per image - matrix kör jobbet en gång per rad, parallellt
        include:
          - name: user-server
            dockerfile: Dockerfile.user_server
          - name: cmdb-server
            dockerfile: Dockerfile.cmdb_server
          - name: incident-server
            dockerfile: Dockerfile.incident_server
          - name: audit-server
            dockerfile: Dockerfile.audit_server
          - name: fastapi-app
            dockerfile: Dockerfile.fastapi
          - name: change-service
            dockerfile: Dockerfile.changeservice

    steps:
      - uses: actions/checkout@v4 # hämtar repot in i runnern

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          # vars.* = de repo-variabler som lagts in i Github
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name enterpriseitplatformacr

      - name: Build and push ${{ matrix.name }}
        # server/ som build-kontext för samtliga 6 images
        run: |
          docker build -f server/${{ matrix.dockerfile }} -t enterpriseitplatformacr.azurecr.io/${{ matrix.name }}:latest server/
          docker push enterpriseitplatformacr.azurecr.io/${{ matrix.name }}:latest
