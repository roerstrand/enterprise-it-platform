services:
  postgres:
    image: postgres:16
    container_name: microservices-postgres
    environment:
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=devpass
      - POSTGRES_DB=microservices
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  prometheus:
    image: prom/prometheus:latest
    container_name: enterprise-it-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
  grafana:
    image: grafana/grafana:latest
    container_name: enterprise-it-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: enterprise-it-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: enterprise-it-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    container_name: enterprise-it-redis
    ports:
      - "6379:6379"

  nginx:
   image: nginx:latest
   container_name: enterprise-it-nginx
   ports:
    - "80:80"
   volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
   extra_hosts:
    - "host.docker.internal:host-gateway"

volumes:
  postgres_data: